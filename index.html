<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>여러가지 사각형 하늘계단</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #38bdf8 0%, #bae6fd 100%);
      --card-bg: #ffffff;
      --primary-blue: #0284c7;
      --primary-red: #e11d48;
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 880px;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    @media (min-width: 500px) {
      .game-wrapper {
        height: 94vh;
        border-radius: 32px;
        overflow: hidden;
        border: 4px solid #ffffff;
      }
    }

    .header {
      height: 64px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: background 0.15s;
    }

    .btn-icon:active {
      background: rgba(0,0,0,0.08);
    }

    .title-text {
      font-size: 15px;
      font-weight: 800;
      color: #0369a1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .heart-box {
      font-size: 16px;
      letter-spacing: -1px;
    }

    .badge-info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #0369a1;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .question-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 16px 14px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      border: 2px solid #ffffff;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .q-floor-tag {
      font-size: 11px;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 14.5px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.38;
      word-break: keep-all;
    }

    .viewport-3d {
      flex: 1;
      background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      border: 3px solid #ffffff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
    }

    .stairs-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .stair-item {
      position: absolute;
      width: 130px;
      height: 32px;
      background: #fde047;
      border: 2.5px solid #ca8a04;
      border-radius: 10px;
      box-shadow: 0 5px 0 #a16207;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #713f12;
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
    }

    .stair-item.current {
      background: #facc15;
      border-color: #854d0e;
      box-shadow: 0 5px 0 #713f12, 0 0 14px rgba(250, 204, 21, 0.9);
    }

    .stair-item.checkpoint {
      background: #a855f7;
      border-color: #7e22ce;
      color: #ffffff;
      box-shadow: 0 5px 0 #6b21a8;
    }

    .stair-item.goal {
      background: #f97316;
      border-color: #c2410c;
      color: #ffffff;
      box-shadow: 0 5px 0 #9a3412;
    }

    .charizard-box {
      position: absolute;
      width: 58px;
      height: 58px;
      z-index: 15;
      transition: left 0.35s ease-out, top 0.35s ease-out;
      pointer-events: none;
    }

    .charizard-svg {
      width: 100%;
      height: 100%;
      transform-origin: bottom center;
    }

    .charizard-shadow {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 7px;
      background: rgba(0,0,0,0.18);
      border-radius: 50%;
      transition: transform 0.35s, opacity 0.35s;
    }

    @keyframes jumpOneStep {
      0% { transform: scale(1, 1) translateY(0); }
      25% { transform: scale(1.2, 0.8) translateY(6px); }
      55% { transform: scale(0.9, 1.2) translateY(-38px); }
      85% { transform: scale(1.05, 0.95) translateY(2px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .charizard-box.jumping .charizard-svg {
      animation: jumpOneStep 0.38s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .charizard-box.jumping .charizard-shadow {
      transform: translateX(-50%) scale(0.3);
      opacity: 0.2;
    }

    .ox-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 10;
    }

    .btn-ox {
      height: 68px;
      border: none;
      border-radius: 20px;
      font-size: 30px;
      font-weight: 900;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: transform 0.08s;
      touch-action: manipulation;
    }

    .btn-ox:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }

    .btn-o-style {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      border-bottom: 3.5px solid #0369a1;
    }

    .btn-x-style {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      border-bottom: 3.5px solid #be123c;
    }

    .btn-hint {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.85;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .popup-card {
      background: white;
      width: 100%;
      max-width: 350px;
      border-radius: 26px;
      padding: 22px 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.18);
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 101;
    }

    .modal-overlay.show .popup-card {
      transform: scale(1);
    }

    .popup-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .explain-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      text-align: left;
      font-size: 13px;
      color: #334155;
      line-height: 1.45;
      margin: 12px 0;
    }

    .btn-main {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      touch-action: manipulation;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-sub {
      width: 100%;
      padding: 11px;
      background: #f1f5f9;
      color: #475569;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      touch-action: manipulation;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
    }

    .floor-chip {
      padding: 11px 8px;
      border: 2px solid #cbd5e1;
      background: white;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
      touch-action: manipulation;
    }

    .floor-chip.active {
      border-color: #0284c7;
      background: #f0f9ff;
      color: #0284c7;
    }

    .cp-notice {
      background: #f3e8ff;
      border: 1px dashed #a855f7;
      color: #6b21a8;
      font-size: 12px;
      font-weight: 700;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <div class="header-left">
      <button class="btn-icon" id="btnHome">🏠</button>
      <span class="title-text">여러가지 사각형 하늘계단</span>
    </div>
    <div class="header-right">
      <div class="heart-box" id="heartBox">❤️❤️❤️</div>
      <div class="badge-info" style="background:#fef3c7; border-color:#fde047; color:#854d0e;">
        🚩 <span id="floorText">1 / 10F</span>
      </div>
      <button class="btn-icon" id="btnPause">⏸️</button>
    </div>
  </div>

  <div class="main-container">
    <div class="question-box">
      <div class="q-floor-tag" id="qFloorTag">1층 도전</div>
      <div class="q-text" id="qText">문제를 불러오는 중...</div>
    </div>

    <div class="viewport-3d" id="viewport">
      <div class="stairs-container" id="stairsStage">
        <div class="charizard-box" id="charizard">
          <div class="charizard-shadow"></div>
          <svg class="charizard-svg" viewBox="0 0 100 100">
            <path d="M 20 70 Q 10 65 12 55 Q 22 50 25 65 Z" fill="#ef4444"/>
            <path d="M 18 68 Q 12 65 14 58 Q 20 54 22 65 Z" fill="#f59e0b"/>
            <path d="M 40 45 Q 20 20 10 35 Q 25 50 42 55 Z" fill="#065f46"/>
            <ellipse cx="50" cy="60" rx="20" ry="22" fill="#f97316"/>
            <ellipse cx="53" cy="62" rx="13" ry="15" fill="#fef08a"/>
            <path d="M 40 38 C 40 20 65 20 68 35 C 70 42 60 48 48 45 Z" fill="#f97316"/>
            <path d="M 45 25 Q 35 15 32 20 Q 40 28 44 28 Z" fill="#ea580c"/>
            <path d="M 52 23 Q 48 10 42 14 Q 48 24 51 25 Z" fill="#ea580c"/>
            <circle cx="58" cy="30" r="3" fill="#ffffff"/>
            <circle cx="59" cy="30" r="1.5" fill="#0f172a"/>
            <path d="M 62 38 Q 66 38 65 41" stroke="#431407" stroke-width="2" fill="none"/>
            <ellipse cx="42" cy="80" rx="6" ry="4" fill="#ea580c"/>
            <ellipse cx="60" cy="80" rx="6" ry="4" fill="#ea580c"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="ox-controls">
      <button class="btn-ox btn-o-style" id="btnO">
        O
        <span class="btn-hint">[←] 참</span>
      </button>
      <button class="btn-ox btn-x-style" id="btnX">
        X
        <span class="btn-hint">[→] 거짓</span>
      </button>
    </div>
  </div>

  <!-- 시작 모달 -->
  <div class="modal-overlay show" id="startModal">
    <div class="popup-card">
      <div style="font-size: 46px; margin-bottom: 6px;">🔥🐉</div>
      <div class="popup-title">목표 층수 선택</div>
      <p style="font-size: 13px; color: #64748b; line-height: 1.4;">
        원하는 목표 층수를 선택하여 등반을 시작하세요!<br>
        10층마다 체크포인트가 자동으로 저장됩니다.
      </p>

      <div class="cp-notice" id="startCpNotice"></div>

      <div class="floor-grid">
        <button class="floor-chip active" id="chip10">🏁 10층 도전</button>
        <button class="floor-chip" id="chip25">🏁 25층 도전</button>
        <button class="floor-chip" id="chip50">🏁 50층 도전</button>
        <button class="floor-chip" id="chip100">🏆 100층 도전</button>
      </div>

      <button class="btn-main" id="btnStartGame">1층부터 등반 시작 🚀</button>
      <button class="btn-sub" id="btnResumeCP" style="display:none;">📍 저장된 체크포인트부터 시작</button>
    </div>
  </div>

  <!-- 오답 모달 -->
  <div class="modal-overlay" id="wrongModal">
    <div class="popup-card">
      <div style="font-size: 38px; margin-bottom: 2px;">💔</div>
      <div class="popup-title" style="color: #e11d48;">오답입니다! (하트 -1)</div>
      <p style="font-size: 13px; color: #475569;" id="wrongAnswerDiff"></p>
      
      <div class="explain-card">
        <div style="font-weight: 800; color: #0284c7; margin-bottom: 3px;">💡 개념 해설</div>
        <div id="explainContent">해설 내용</div>
      </div>

      <button class="btn-main" id="btnNextWrong">다음 문제 도전하기 🧗</button>
    </div>
  </div>

  <!-- 일시정지 모달 -->
  <div class="modal-overlay" id="pauseModal">
    <div class="popup-card">
      <div style="font-size: 38px; margin-bottom: 6px;">⏸️</div>
      <div class="popup-title">게임 일시정지</div>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 14px;">잠시 멈춘 상태입니다.</p>
      <button class="btn-main" id="btnResume">계속하기 ▶️</button>
      <button class="btn-sub" id="btnQuitPause">처음으로 돌아가기</button>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div class="modal-overlay" id="resultModal">
    <div class="popup-card">
      <div style="font-size: 48px; margin-bottom: 6px;" id="resultIcon">👑</div>
      <div class="popup-title" id="resultTitle">목표 달성 성공!</div>
      
      <div style="background: #f8fafc; border-radius: 16px; padding: 14px; margin: 14px 0;">
        <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px;">
          <span style="color: #64748b;">최종 달성:</span>
          <span style="font-weight: 800; color: #0284c7;" id="resultFloor">10 / 10F</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="color: #64748b;">총 소요 시간:</span>
          <span style="font-weight: 800; color: #16a34a;" id="resultTime">01분 24초</span>
        </div>
      </div>

      <button class="btn-main" id="btnRestartCP" style="display:none;">📍 최고 체크포인트부터 이어서 도전</button>
      <button class="btn-sub" id="btnRestart1F">1층부터 새로 시작하기 🔄</button>
      <button class="btn-sub" id="btnHomeResult">처음으로 돌아가기</button>
    </div>
  </div>
</div>

<script>
// 순수 중2-2 사각형의 성질 교과과정 100문항 (외접원 등 원 관련 문항 전면 제외)
const quizBank = [
  { q: "두 쌍의 대변이 각각 평행한 사각형은 평행사변형이다.", a: true, e: "평행사변형의 정의는 두 쌍의 대변이 각각 평행한 사각형입니다." },
  { q: "평행사변형의 두 대각선은 서로를 이등분한다.", a: true, e: "평행사변형의 주요 성질 중 하나로 두 대각선은 서로 다른 것을 이등분합니다." },
  { q: "네 내각의 크기가 모두 같은 사각형은 직사각형이다.", a: true, e: "직사각형의 정의는 네 내각의 크기가 모두 90도로 같은 사각형입니다." },
  { q: "마름모의 두 대각선의 길이는 항상 같다.", a: false, e: "마름모의 두 대각선은 수직이등분하지만 길이는 다를 수 있습니다. (길이가 같으면 정사각형)" },
  { q: "한 내각이 직각인 평행사변형은 직사각형이다.", a: true, e: "평행사변형에서 한 내각이 90도가 되면 네 내각이 모두 직각이 되어 직사각형이 됩니다." },
  { q: "이웃하는 두 변의 길이가 같은 평행사변형은 마름모이다.", a: true, e: "평행사변형은 대변의 길이가 같으므로 이웃한 변까지 같아지면 네 변의 길이가 같아져 마름모가 됩니다." },
  { q: "직사각형의 두 대각선은 서로 수직으로 만난다.", a: false, e: "직사각형의 두 대각선은 길이가 같지만 수직으로 만나지는 않습니다. (수직이면 정사각형)" },
  { q: "정사각형은 직사각형인 동시에 마름모이다.", a: true, e: "정사각형은 네 각이 같고(직사각형) 네 변이 같으므로(마름모) 두 성질을 모두 가집니다." },
  { q: "등변사다리꼴의 두 대각선의 길이는 같다.", a: true, e: "등변사다리꼴은 평행하지 않은 한 쌍의 대변 길이와 두 대각선의 길이가 같습니다." },
  { q: "두 대각선이 서로를 수직이등분하는 사각형은 마름모이다.", a: true, e: "두 대각선이 서로 수직이등분하면 네 변의 길이가 같은 마름모가 됩니다." },
  { q: "마름모의 네 내각의 크기는 모두 같다.", a: false, e: "마름모는 네 변의 길이가 같은 사각형이며, 네 내각의 크기가 모두 같은 것은 직사각형입니다." },
  { q: "대각선의 길이가 같은 평행사변형은 직사각형이다.", a: true, e: "평행사변형에서 두 대각선의 길이가 같아지면 직사각형이 됩니다." },

  { q: "직사각형의 네 내각의 합은 360도이다.", a: true, e: "모든 사각형의 내각의 합은 360도입니다." }
];

let currentQuestions = [];
let currentFloor = 1;
let targetGoalFloor = 10;
let highestCheckpoint = 1;
let lives = 3;
let timeSpent = 0;
let timerId = null;
let isPaused = false;

const stepLayout = [
  { left: 35, top: 310 },
  { left: 75, top: 260 },
  { left: 115, top: 210 },
  { left: 155, top: 160 },
  { left: 195, top: 110 },
  { left: 235, top: 60 }
];

const startModal = document.getElementById('startModal');
const wrongModal = document.getElementById('wrongModal');
const pauseModal = document.getElementById('pauseModal');
const resultModal = document.getElementById('resultModal');

const qFloorTag = document.getElementById('qFloorTag');
const qText = document.getElementById('qText');
const heartBox = document.getElementById('heartBox');
const floorText = document.getElementById('floorText');
const stairsStage = document.getElementById('stairsStage');
const charizard = document.getElementById('charizard');

function loadCheckpointStorage() {
  const savedCP = localStorage.getItem('math_sky_stairs_cp');
  if (savedCP && parseInt(savedCP) > 1) {
    highestCheckpoint = parseInt(savedCP);
    const noticeEl = document.getElementById('startCpNotice');
    noticeEl.style.display = 'block';
    noticeEl.textContent = `📍 최근 도달 체크포인트: ${highestCheckpoint}F`;
    const btnResumeCP = document.getElementById('btnResumeCP');
    btnResumeCP.style.display = 'block';
    btnResumeCP.textContent = `📍 ${highestCheckpoint}F 체크포인트부터 이어서 시작`;
  }
}

function saveCheckpoint(floor) {
  if (floor % 10 === 0 && floor > highestCheckpoint) {
    highestCheckpoint = floor;
    localStorage.setItem('math_sky_stairs_cp', highestCheckpoint);
  }
}

function setTargetGoal(goal, btnEl) {
  targetGoalFloor = goal;
  document.querySelectorAll('.floor-chip').forEach(c => c.classList.remove('active'));
  btnEl.classList.add('active');
}

function makeShuffledQuestions() {
  let list = JSON.parse(JSON.stringify(quizBank));
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function buildStepView() {
  const oldSteps = document.querySelectorAll('.stair-item');
  oldSteps.forEach(s => s.remove());

  stepLayout.forEach((pos, idx) => {
    const step = document.createElement('div');
    step.className = 'stair-item';
    step.id = `stepItem_${idx}`;
    step.style.left = `${pos.left}px`;
    step.style.top = `${pos.top}px`;
    stairsStage.appendChild(step);
  });
}

function updateStepLabels() {
  stepLayout.forEach((_, idx) => {
    const stepEl = document.getElementById(`stepItem_${idx}`);
    if (stepEl) {
      const floorVal = currentFloor + (idx - 1);
      stepEl.classList.toggle('current', idx === 1);
      
      if (floorVal < 1 || floorVal > targetGoalFloor) {
        stepEl.style.opacity = '0';
      } else {
        stepEl.style.opacity = '1';
        if (floorVal === targetGoalFloor) {
          stepEl.textContent = `${floorVal}F 🏆`;
          stepEl.className = 'stair-item goal';
        } else if (floorVal % 10 === 0) {
          stepEl.textContent = `${floorVal}F 📍`;
          stepEl.className = 'stair-item checkpoint';
        } else {
          stepEl.textContent = `${floorVal}F`;
          stepEl.className = 'stair-item';
        }
        if (idx === 1) stepEl.classList.add('current');
      }
    }
  });

  charizard.style.left = `${stepLayout[1].left + 35}px`;
  charizard.style.top = `${stepLayout[1].top - 48}px`;
}

function initGame(fromCheckpoint = false) {
  currentQuestions = makeShuffledQuestions();
  currentFloor = fromCheckpoint ? highestCheckpoint : 1;
  lives = 3;
  timeSpent = 0;
  isPaused = false;

  startModal.classList.remove('show');
  resultModal.classList.remove('show');
  pauseModal.classList.remove('show');
  wrongModal.classList.remove('show');

  buildStepView();
  updateUIHeader();
  updateStepLabels();
  loadCurrentQuestion();
  runTimer();
}

function loadCurrentQuestion() {
  if (currentFloor > targetGoalFloor) {
    finishGame(true);
    return;
  }
  qFloorTag.textContent = `${currentFloor}층 도전 (목표: ${targetGoalFloor}F)`;
  qText.textContent = currentQuestions[currentFloor - 1].q;
}

function handleAnswer(userAns) {
  if (isPaused) return;

  const currentQ = currentQuestions[currentFloor - 1];

  if (userAns === currentQ.a) {
    charizard.style.left = `${stepLayout[2].left + 35}px`;
    charizard.style.top = `${stepLayout[2].top - 48}px`;
    charizard.classList.add('jumping');

    setTimeout(() => {
      charizard.classList.remove('jumping');
      saveCheckpoint(currentFloor);

      currentFloor++;
      updateUIHeader();
      updateStepLabels();

      if (currentFloor > targetGoalFloor) {
        finishGame(true);
      } else {
        loadCurrentQuestion();
      }
    }, 380);

  } else {
    lives--;
    updateUIHeader();

    if (lives <= 0) {
      finishGame(false);
    } else {
      document.getElementById('wrongAnswerDiff').innerHTML = 
        `올바른 정답: <b>${currentQ.a ? 'O (참)' : 'X (거짓)'}</b> / 내가 고른 답: <span style="color:#e11d48;">${userAns ? 'O' : 'X'}</span>`;
      document.getElementById('explainContent').textContent = currentQ.e;
      wrongModal.classList.add('show');
    }
  }
}

function updateUIHeader() {
  heartBox.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  floorText.textContent = `${currentFloor} / ${targetGoalFloor}F`;
}

function runTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!isPaused) {
      timeSpent++;
    }
  }, 1000);
}

function finishGame(isSuccess) {
  clearInterval(timerId);

  const mSpent = Math.floor(timeSpent / 60).toString().padStart(2, '0');
  const sSpent = (timeSpent % 60).toString().padStart(2, '0');

  const reachedFloor = Math.min(targetGoalFloor, currentFloor);
  document.getElementById('resultFloor').textContent = `${reachedFloor}F / ${targetGoalFloor}F`;
  document.getElementById('resultTime').textContent = `${mSpent}분 ${sSpent}초`;

  if (isSuccess || currentFloor > targetGoalFloor) {
    document.getElementById('resultIcon').textContent = '👑';
    document.getElementById('resultTitle').textContent = `${targetGoalFloor}층 정복 성공!`;
  } else {
    document.getElementById('resultIcon').textContent = '💥';
    document.getElementById('resultTitle').textContent = '등반 실패';
  }

  const btnCP = document.getElementById('btnRestartCP');
  if (highestCheckpoint > 1) {
    btnCP.style.display = 'block';
    btnCP.textContent = `📍 최고 체크포인트(${highestCheckpoint}F)부터 도전`;
  } else {
    btnCP.style.display = 'none';
  }

  resultModal.classList.add('show');
}

document.getElementById('chip10').addEventListener('click', function() { setTargetGoal(10, this); });
document.getElementById('chip25').addEventListener('click', function() { setTargetGoal(25, this); });
document.getElementById('chip50').addEventListener('click', function() { setTargetGoal(50, this); });
document.getElementById('chip100').addEventListener('click', function() { setTargetGoal(100, this); });

document.getElementById('btnStartGame').addEventListener('click', () => initGame(false));
document.getElementById('btnResumeCP').addEventListener('click', () => initGame(true));
document.getElementById('btnRestartCP').addEventListener('click', () => initGame(true));
document.getElementById('btnRestart1F').addEventListener('click', () => initGame(false));

document.getElementById('btnO').addEventListener('click', () => handleAnswer(true));
document.getElementById('btnX').addEventListener('click', () => handleAnswer(false));

document.getElementById('btnNextWrong').addEventListener('click', () => {
  wrongModal.classList.remove('show');
  loadCurrentQuestion();
});

window.addEventListener('keydown', (e) => {
  if (wrongModal.classList.contains('show') || startModal.classList.contains('show') || resultModal.classList.contains('show') || pauseModal.classList.contains('show')) return;
  if (e.key === 'ArrowLeft') handleAnswer(true);
  if (e.key === 'ArrowRight') handleAnswer(false);
});

document.getElementById('btnPause').addEventListener('click', () => {
  isPaused = true;
  pauseModal.classList.add('show');
});

document.getElementById('btnResume').addEventListener('click', () => {
  isPaused = false;
  pauseModal.classList.remove('show');
});

document.getElementById('btnQuitPause').addEventListener('click', () => {
  pauseModal.classList.remove('show');
  startModal.classList.add('show');
  clearInterval(timerId);
});

document.getElementById('btnHome').addEventListener('click', () => {
  isPaused = true;
  pauseModal.classList.add('show');
});

document.getElementById('btnHomeResult').addEventListener('click', () => {
  resultModal.classList.remove('show');
  startModal.classList.add('show');
});

loadCheckpointStorage();
</script>
</body>
</html>
